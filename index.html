<!doctype html>
<html lang="es">
  <head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Invitación Digital</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/envelope.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body class="">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
      <!-- =========================
              SOBRE VIRTUAL
      ========================== -->
      <div class="envelope-screen" id="envelopeScreen">
        <div class="envelope">
          <div class="envelope-flap"></div>
          <div class="wax-seal" id="openEnvelope"></div>
        </div>
      </div>

      <div class="invitation-content hidden" id="invitationContent">
        <div class="container">
          <!-- =========================
              MÚSICA
          ========================== -->
          {{#musica}}
          <audio id="backgroundMusic" autoplay loop>
            <source src="{{musica.archivo}}" type="audio/mpeg" />
          </audio>
          {{/musica}}

          <!-- =========================
              PORTADA
          ========================== -->
          <section id="hero">
            <div class="hero"></div>

            <div class="hero-content">
              <div class="hero-text">
                <h1 class="hero-title">{{portada.titulo}}</h1>
              </div>
            </div>
          </section>

          <section id="name">
            <div class="name">
              <h2 class="name-xv">{{portada.nombre}}</h2>
              <p class="edition-xv">{{portada.edicion}}</p>
              <span class="edition-year">{{portada.anio}}</span>
            </div>
          </section>

          <!-- =========================
          WELCOME
          ========================== -->
          {{#bienvenida}}
          <section id="welcome">
            <span class="editorial-label">{{bienvenida.etiqueta}}</span>
            <p class="editorial-message">{{bienvenida.texto}}</p>
          </section>
          {{/bienvenida}}

          <!-- =========================
          FOTOS PRINCIPALES
          ========================== -->
          {{?fotosPrincipales}}
          <section id="fotos-principales">
            <div class="container-fotos">
              {{#fotosPrincipales}}<img src="{{foto}}" alt="{{alt}}" />{{/fotosPrincipales}}
            </div>
          </section>
          {{/fotosPrincipales}}

          <!-- =========================
          CUENTA REGRESIVA (la fecha sale de evento.inicio)
          ========================== -->
          {{#cuentaRegresiva}}
          <section id="countdown">
            <div class="fecha">
              <h1>{{cuentaRegresiva.dia}}</h1>
              <h2>{{cuentaRegresiva.fecha}}</h2>
            </div>
            <div class="timer">
              <h1 class="timer-titulo">{{cuentaRegresiva.titulo}}</h1>
              <ul class="date-time">
                <li>
                  <div class="time_number" id="dias"></div>
                  <div class="time_txt">{{cuentaRegresiva.dias}}</div>
                </li>
                <li>
                  <div class="time_number" id="horas"></div>
                  <div class="time_txt">{{cuentaRegresiva.horas}}</div>
                </li>
                <li>
                  <div class="time_number" id="minutos"></div>
                  <div class="time_txt">{{cuentaRegresiva.minutos}}</div>
                </li>
                <li>
                  <div class="time_number" id="segundos"></div>
                  <div class="time_txt">{{cuentaRegresiva.segundos}}</div>
                </li>
              </ul>
            </div>
          </section>
          {{/cuentaRegresiva}}

          <!-- CALENDARIO (los días los arma script.js con evento.inicio) -->
          {{#calendario}}
          <section id="calendar" class="section">
            <div class="editorial-header">
              <span class="editorial-tag">{{calendario.etiqueta}}</span>
              <h2 class="editorial-title">{{calendario.titulo}}</h2>
            </div>

            <div class="calendar" id="calendarGrid"></div>

            <a class="btn-calendar" id="btnCalendar" href="#" target="_blank">{{calendario.boton}}</a>
          </section>
          {{/calendario}}

          <!-- =========================
          HISTORIA / MENSAJE
          ========================== -->
          {{#historia}}
          <section id="editorial-story">
            <div class="editorial-heading">
              <span class="editorial-category">{{historia.categoria}}</span>
              <h2 class="editorial-title">{{historia.titulo}}</h2>
              <p class="editorial-subtitle">{{historia.subtitulo}}</p>
            </div>

            <figure class="editorial-photo">
              <img src="{{historia.foto}}" alt="{{historia.fotoAlt}}" />
              <figcaption>{{historia.pieDeFoto}}</figcaption>
            </figure>

            <article class="editorial-article">
              {{#historia.parrafos}}<p>{{.}}</p>{{/historia.parrafos}}
            </article>
          </section>
          {{/historia}}

          <!-- =========================
          PADRES Y PADRINOS
          ========================== -->
          {{?collage}}
          <section class="collage">
            {{#collage}}
            <div class="card card{{@indice}}">
              <img src="{{.}}" />
            </div>
            {{/collage}}
          </section>
          {{/collage}}

          {{#familia}}
          <section class="section-familia">
            <div class="familia-container">
              <span class="familia-subtitulo">{{familia.subtitulo}}</span>
              <h2 class="familia-titulo">{{familia.titulo}}</h2>
              <p class="familia-texto">{{familia.texto}}</p>

              <div class="linea"></div>

              <div class="familia-grid">
                {{#familia.grupos}}
                <div class="familia-item">
                  <h3>{{titulo}}</h3>
                  {{#nombres}}<p>{{.}}</p>{{/nombres}}
                </div>
                {{/familia.grupos}}
              </div>
            </div>
          </section>
          {{/familia}}

          <!-- =========================
          CRONOGRAMA
          ========================== -->
          {{#cronograma}}
          <section class="schedule">
            <div class="schedule-header">
              <span class="schedule-tag">{{cronograma.etiqueta}}</span>
              <h2 class="schedule-title">{{cronograma.titulo}}</h2>
              <p class="schedule-description">{{cronograma.descripcion}}</p>
            </div>

            <div class="schedule-list">
              {{#cronograma.actividades}}
              <article class="schedule-item">
                <div class="schedule-time">
                  <span class="hour">{{hora}}</span>
                  <span class="minutes">{{minutos}}</span>
                </div>

                <div class="schedule-content">
                  <span class="number">{{@numero}}</span>
                  <h3>{{actividad}}</h3>
                  {{#lugar}}<p>{{lugar}}</p>{{/lugar}}
                </div>
              </article>
              {{/cronograma.actividades}}
            </div>
          </section>
          {{/cronograma}}

          <!-- =========================
          CEREMONIA y RECEPCIÓN
          ========================== -->
          {{#ubicaciones}}
          <section class="Ubicaciones">
            <img src="./assets/icons/copas.png" class="ubicacionHero" alt="" />
          </section>

          <section class="boarding-section">
            <div class="section-title">
              <span>{{ubicaciones.etiqueta}}</span>
              <h2>{{ubicaciones.titulo}}</h2>
            </div>

            {{#ubicaciones.pases}}
            <article class="boarding-pass {{@lado}}">
              <div class="ticket-cut left-cut"></div>
              <div class="ticket-cut right-cut"></div>

              <small>{{etiqueta}}</small>
              <h3>{{titulo}}</h3>
              <h4>{{lugar}}</h4>

              <div class="ticket-divider"></div>

              <div class="ticket-info">
                {{#datos}}
                <div>
                  <span>{{etiqueta}}</span>
                  <strong>{{valor}}</strong>
                </div>
                {{/datos}}
              </div>

              <a href="{{mapa}}" target="_blank">{{boton}}</a>
            </article>
            {{/ubicaciones.pases}}
          </section>
          {{/ubicaciones}}

          <!-- =========================
          DRESS CODE
          ========================== -->
          {{#vestimenta}}
          <section id="dresscode" class="dresscode-section">
            <div class="dresscode-heading">
              <span class="editorial-tag">{{vestimenta.etiqueta}}</span>
              <h2>{{vestimenta.titulo}}</h2>
              <p>{{vestimenta.subtitulo}}</p>
            </div>

            <div class="dresscode-card">
              <span class="dresscode-number">{{vestimenta.numero}}</span>
              <p class="dresscode-label">{{vestimenta.etiquetaTarjeta}}</p>
              <h3>{{vestimenta.codigo}}</h3>
              <div class="dresscode-line"></div>
              <p class="dresscode-copy">{{vestimenta.texto}}</p>
            </div>
          </section>
          {{/vestimenta}}

          <!-- =========================
          MESA DE REGALOS
          ========================== -->
          {{#regalos}}
          <section id="gifts" class="gifts-section">
            <div class="gifts-heading">
              <span class="editorial-tag">{{regalos.etiqueta}}</span>
              <h2>{{regalos.titulo}}</h2>
              <p>{{regalos.subtitulo}}</p>
            </div>

            <div class="gifts-card">
              <span class="gifts-edition">{{regalos.edicion}}</span>
              <h3>{{regalos.tituloTarjeta}}</h3>
              <p>{{regalos.texto}}</p>
              {{#regalos.boton}}
              <a class="gifts-link" href="{{regalos.link}}" target="_blank" rel="noopener noreferrer">
                {{regalos.boton}} <span aria-hidden="true">→</span>
              </a>
              {{/regalos.boton}}
            </div>
          </section>
          {{/regalos}}

          <!-- =========================
          CONFIRMACIÓN (el número va en confirmacion.whatsapp)
          ========================== -->
          {{#confirmacion}}
          <section id="rsvp" class="rsvp-section">
            <div class="rsvp-card">
              <span class="editorial-tag">{{confirmacion.etiqueta}}</span>
              <h2>{{confirmacion.titulo}}</h2>
              <p>{{confirmacion.texto}}</p>
              <a class="rsvp-link" href="https://wa.me/{{confirmacion.whatsapp}}" target="_blank" rel="noopener noreferrer"
                >{{confirmacion.boton}} <span aria-hidden="true">→</span></a
              >
            </div>
          </section>
          {{/confirmacion}}

          <!-- =========================
          SECCIÓN EXTRA
          ========================== -->
          {{#instagram}}
          <section id="extras" class="social-section">
            <span class="editorial-tag">{{instagram.etiqueta}}</span>
            <h2>{{instagram.titulo}}</h2>
            <p>{{instagram.texto}}</p>
            <a class="social-hashtag" href="{{instagram.link}}" target="_blank" rel="noopener noreferrer">{{instagram.hashtag}}</a>
            <p class="social-note">{{instagram.nota}}</p>
          </section>
          {{/instagram}}

          <!-- =========================
              FOOTER
          ========================== -->
          <footer class="mirai-footer">
            <span>{{footer.etiqueta}}</span>
            <p>{{footer.texto}}</p>
            <a href="{{footer.link}}" aria-label="{{footer.marca}}">{{footer.marca}}</a>
            <small>{{footer.subtitulo}}</small>
          </footer>
        </div>
      </div>

      <!-- JavaScript -->
      <script src="js/script.js"></script>
    </template>

    <script src="js/motor.js"></script>
  </body>
</html>

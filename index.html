<!doctype html>
<html lang="es">
  <head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Invitación Digital</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/envelope.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body class="">
    <!-- =========================
            SOBRE VIRTUAL
    ========================== -->
    <div class="envelope-screen" id="envelopeScreen">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="wax-seal" id="openEnvelope"></div>
      </div>
    </div>

    <div class="invitation-content hidden" id="invitationContent">
      <div class="container">
        <!-- =========================
            MÚSICA
    ========================== -->
        <audio id="backgroundMusic" autoplay loop>
          <source src="./assets/music/background.mp3" type="audio/mpeg" />
          Tu navegador no soporta el elemento de audio.
        </audio>
        <!-- =========================
            PORTADA
    ========================== -->
        <section id="hero">
          <div class="hero">
            <h1 class="hero-title">
              Its <br />
              Party <br />
              Time!
            </h1>
          </div>
        </section>

        <!-- =========================
        MENSAJE DE BIENVENIDA
    ========================== -->
        <section id="welcome">hola</section>

        <!-- =========================
        CUENTA REGRESIVA
    ========================== -->
        <section id="countdown"></section>

        <!-- =========================
        HISTORIA / MENSAJE
    ========================== -->
        <section id="story"></section>

        <!-- =========================
        PADRES Y PADRINOS
    ========================== -->
        <section id="family"></section>

        <!-- =========================
        CRONOGRAMA
    ========================== -->
        <section id="timeline"></section>

        <!-- =========================
        AGREGAR AL CALENDARIO
    ========================== -->
        <section id="calendar"></section>

        <!-- =========================
        GALERÍA
    ========================== -->
        <section id="gallery"></section>

        <!-- =========================
        CEREMONIA
    ========================== -->
        <section id="ceremony"></section>

        <!-- =========================
        RECEPCIÓN
    ========================== -->
        <section id="reception"></section>

        <!-- =========================
        DRESS CODE
    ========================== -->
        <section id="dresscode"></section>

        <!-- =========================
        MESA DE REGALOS
    ========================== -->
        <section id="gifts"></section>

        <!-- =========================
        CONFIRMACIÓN
    ========================== -->
        <section id="rsvp"></section>

        <!-- =========================
        SECCIÓN EXTRA
    ========================== -->
        <section id="extras"></section>

        <!-- =========================
            FOOTER
    ========================== -->
        <footer></footer>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
  </body>
</html>
